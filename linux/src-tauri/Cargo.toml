[package]
name = "afterglow-linux"
version = "0.1.0"
edition = "2021"
rust-version = "1.90"
license-file = "../../LICENSE"
description = "Afterglow music display for Linux"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["image-png", "tray-icon"] }
tauri-plugin-dialog = "2"
tauri-plugin-updater = "=2.14.1"
tauri-plugin-clipboard-manager = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
rustfft = "6"
tauri-plugin-single-instance = "2"

[target.'cfg(not(target_os = "windows"))'.dependencies]
reqwest = { version = "0.13", features = ["blocking"] }

[target.'cfg(target_os = "linux")'.dependencies]
mpris = "2.1"
dbus = "0.9"
gtk = "0.18"
gtk-layer-shell = { version = "0.8", features = ["v0_6"] }
x11rb = { version = "0.13", features = ["shape"] }

[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.61", features = ["Foundation", "Media_Control", "Storage_Streams", "Win32_Foundation", "Win32_System_Com", "Win32_System_WinRT", "Win32_System_Com_StructuredStorage", "Win32_System_Ole", "Win32_System_Variant", "Win32_System_Power", "Win32_System_Threading", "Win32_System_ProcessStatus", "Win32_System_Console", "Win32_System_SystemInformation", "Win32_System_RemoteDesktop", "Win32_UI_WindowsAndMessaging", "Win32_UI_Input_KeyboardAndMouse", "Win32_Media_Audio", "Win32_Media_KernelStreaming", "Win32_Media_Multimedia", "Win32_Storage_FileSystem", "Win32_Security", "Win32_Graphics_Gdi", "Win32_System_LibraryLoader"] }
windows-future = "0.2"
windows-core = "0.61"
