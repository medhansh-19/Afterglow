name: Windows installed preview
on:
  push:
    branches: [codex/windows-app]
    paths: [.github/workflows/windows-installed.yml, windows/tests/native-smoke.ps1]
  workflow_dispatch:
    inputs:
      run_id:
        description: Windows preview workflow containing the installer
        required: true
      check_desktop:
        description: Include native desktop host acceptance
        type: boolean
        default: false
      audit_runtime:
        description: Recheck the installed private DLL graph with no Swift toolchain present
        type: boolean
        default: false
      desktop_layout:
        description: Native fixture layout when Explorer is unavailable
        type: choice
        options: [modern, legacy]
        default: modern
      release_tag:
        description: Versioned Windows draft release to stage
        default: windows-v0.1.1
        required: false
      stage_release:
        description: Upload a verified build to its Windows draft and versioned website asset
        type: boolean
        default: false
      validation_run_id:
        description: Successful clean install and upgrade validation run (required when staging)
        required: false
      verify_upgrade:
        description: Also verify upgrading the pinned original 0.1.0 installer
        type: boolean
        default: false
permissions:
  contents: read
  actions: read
jobs:
  installed:
    if: ${{ !inputs.stage_release }}
    runs-on: windows-2025
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          name: afterglow-windows-x86_64-preview
          path: windows/download
          github-token: ${{ github.token }}
          run-id: ${{ inputs.run_id || '42674498927' }}
      - name: Install and validate without Swift installed
        shell: pwsh
        run: |
          $installer = Get-ChildItem windows/download -Recurse -Filter '*setup.exe' | Select-Object -First 1
          if (-not $installer) { throw 'Installer missing' }
          $install = Join-Path $env:RUNNER_TEMP 'afterglow-installed'
          $setup = Start-Process $installer.FullName -ArgumentList @('/S', "/D=$install") -PassThru -Wait
          if ($setup.ExitCode -ne 0) { throw 'Installer failed' }
          $desktop = '${{ inputs.check_desktop }}' -eq 'true'
          ./windows/tests/native-smoke.ps1 -AppPath (Join-Path $install 'afterglow-windows.exe') -OutputDirectory windows/test-results/native -CheckDesktop:$desktop -DesktopLayout '${{ inputs.desktop_layout || 'modern' }}'
          python windows/scripts/measure-package.py --installer $installer.FullName --installed $install --output windows/test-results/size/package.json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Audit installed runtime without developer tools
        if: inputs.audit_runtime
        shell: pwsh
        run: |
          if (Get-Command swift -ErrorAction SilentlyContinue) { throw 'This audit requires a runner without the Swift toolchain.' }
          ./windows/tests/packaging.ps1
          python -m pip install -r windows/scripts/requirements-build.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m unittest discover -s windows/tests -p test_packaging.py -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $install = Join-Path $env:RUNNER_TEMP 'afterglow-installed'
          $roots = Join-Path $env:RUNNER_TEMP 'installed-runtime-roots.json'
          ConvertTo-Json -InputObject @((Join-Path $install 'runtime')) | Set-Content $roots -Encoding utf8
          python windows/scripts/stage-runtime.py --binary (Join-Path $install 'afterglow-lyrics.exe') --roots $roots --system (Join-Path $env:SystemRoot 'System32') --destination (Join-Path $env:RUNNER_TEMP 'audited-runtime') --report windows/test-results/size/installed-runtime-manifest.json --extras windows/runtime-extra-dlls.json --mode imports
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          ./windows/tests/provider-smoke.ps1 -HelperPath (Join-Path $install 'afterglow-lyrics.exe')
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-installed-validation
          path: windows/test-results

  upgrade:
    if: github.event_name == 'workflow_dispatch' && inputs.verify_upgrade && !inputs.stage_release
    runs-on: windows-2025
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          name: afterglow-windows-x86_64-preview
          path: windows/download
          github-token: ${{ github.token }}
          run-id: ${{ inputs.run_id }}
      - uses: actions/download-artifact@v4
        with:
          name: afterglow-windows-x86_64-preview
          path: windows/baseline
          github-token: ${{ github.token }}
          run-id: '42674498927'
      - name: Verify an existing preview upgrades with its library intact
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $baseline = Get-ChildItem windows/baseline -Recurse -Filter '*setup.exe' | Select-Object -First 1
          if (-not $baseline) { throw 'Original 0.1.0 installer missing.' }
          $old = $baseline.FullName
          $oldHash = (Get-FileHash $old -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($oldHash -ne '0611760eb71e739d41c40774e0221eb698567e2e4892f2e681672df4e8e9c267') { throw 'The published baseline changed. Review the upgrade fixture before proceeding.' }
          $install = Join-Path $env:RUNNER_TEMP 'afterglow-upgrade'
          $setup = Start-Process $old -ArgumentList @('/S', "/D=$install") -Wait -PassThru
          if ($setup.ExitCode -ne 0) { throw 'Baseline installation failed.' }
          ./windows/tests/native-smoke.ps1 -AppPath (Join-Path $install 'afterglow-windows.exe') -OutputDirectory windows/test-results/before
          $line = @(Get-Content windows/test-results/before/native.log | Where-Object { $_ -like 'library-path:*' })[-1]
          if (-not $line) { throw 'Baseline library path missing.' }
          $libraryPath = $line.Substring('library-path:'.Length)
          $library = Get-Content $libraryPath -Raw | ConvertFrom-Json
          $library.colors = @([pscustomobject]@{name='Upgrade verification';color='#22ccaa'})
          $library | ConvertTo-Json -Depth 50 | Set-Content $libraryPath -Encoding utf8NoBOM
          $before = (Get-FileHash $libraryPath -Algorithm SHA256).Hash
          $installer = Get-ChildItem windows/download -Recurse -Filter '*setup.exe' | Select-Object -First 1
          if (-not $installer) { throw 'New installer missing.' }
          $setup = Start-Process $installer.FullName -ArgumentList @('/S', "/D=$install") -Wait -PassThru
          if ($setup.ExitCode -ne 0) { throw 'Upgrade installation failed.' }
          $budget = @()
          $runtimeManifest = 'windows/download/size/runtime-manifest.json'
          if (Test-Path $runtimeManifest) {
            $runtimeReport = Get-Content $runtimeManifest -Raw | ConvertFrom-Json
            $expectedDlls = @($runtimeReport.files | ForEach-Object name | Sort-Object)
            $actualDlls = @(Get-ChildItem (Join-Path $install 'runtime') -Filter '*.dll' -File | ForEach-Object Name | Sort-Object)
            $difference = @(Compare-Object $expectedDlls $actualDlls)
            if ($difference.Count) { throw ('Upgrade left missing or stale runtime DLLs: ' + ($difference | Out-String)) }
            if ($runtimeReport.mode -eq 'runtime') { $budget = @('--budget','windows/size-budget.json') }
          }
          python windows/scripts/measure-package.py --installer $installer.FullName --installed $install --output windows/test-results/upgrade-size.json @budget
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if ((Get-FileHash $libraryPath -Algorithm SHA256).Hash -ne $before) { throw 'Installer modified the existing library.' }
          ./windows/tests/native-smoke.ps1 -AppPath (Join-Path $install 'afterglow-windows.exe') -OutputDirectory windows/test-results/after
          if ('${{ inputs.audit_runtime }}' -eq 'true') {
            ./windows/tests/provider-smoke.ps1 -HelperPath (Join-Path $install 'afterglow-lyrics.exe') -OutputDirectory windows/test-results/providers-after-upgrade
          }
          $library = Get-Content $libraryPath -Raw | ConvertFrom-Json
          if ($library.settings.clockSize -ne 120 -or $library.colors[0].name -ne 'Upgrade verification' -or $library.colors[0].color -ne '#22ccaa') { throw 'Updated app did not retain saved preferences and colors.' }
          $version = [regex]::Match($installer.Name, 'Afterglow_([0-9]+\.[0-9]+\.[0-9]+)_').Groups[1].Value
          @{ passed=$true; baseline='0.1.0'; updated=$version; originalInstallerHash=$oldHash; libraryPreserved=$true; savedColorPreserved=$true; nativeRelaunchPassed=$true } | ConvertTo-Json | Set-Content windows/test-results/upgrade.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-upgrade-validation
          path: windows/test-results

  stage-release:
    if: github.event_name == 'workflow_dispatch' && inputs.stage_release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      actions: read
    env:
      GH_TOKEN: ${{ github.token }}
      BUILD_RUN: ${{ inputs.run_id }}
      VALIDATION_RUN: ${{ inputs.validation_run_id }}
      RELEASE_TAG: ${{ inputs.release_tag }}
    steps:
      - uses: actions/checkout@v4
      - name: Require the successful build and clean-machine upgrade checks
        run: |
          python3 - <<'PYCODE'
          import json, os, re, subprocess
          def gh(*args): return json.loads(subprocess.check_output(['gh', *args], text=True))
          for name in ['BUILD_RUN', 'VALIDATION_RUN']:
              assert os.environ[name].isdigit(), 'Use numeric workflow run IDs.'
              run = gh('api', 'repos/medhansh-19/Afterglow/actions/runs/' + os.environ[name])
              assert run['conclusion'] == 'success', name + ' must have passed.'
              if name == 'BUILD_RUN': build = run
          jobs = gh('api', 'repos/medhansh-19/Afterglow/actions/runs/' + os.environ['VALIDATION_RUN'] + '/jobs')['jobs']
          assert all(any(j['name'] == n and j['conclusion'] == 'success' for j in jobs) for n in ['installed', 'upgrade']), 'Clean install and upgrade must both pass.'
          assert re.fullmatch(r'windows-v[0-9]+\.[0-9]+\.[0-9]+', os.environ['RELEASE_TAG']), 'Use a Windows version tag.'
          release = gh('release', 'view', os.environ['RELEASE_TAG'], '--json', 'isDraft,targetCommitish')
          assert release['isDraft'] and release['targetCommitish'] == build['head_sha'], 'Stage only the tested draft source.'
          PYCODE
      - uses: actions/download-artifact@v4
        with:
          name: afterglow-windows-x86_64-preview
          path: windows/download
          github-token: ${{ github.token }}
          run-id: ${{ inputs.run_id }}
      - name: Upload the verified installer without changing the live website alias
        run: |
          python3 - <<'PYCODE'
          from pathlib import Path
          import hashlib, os, shutil
          source = next(Path('windows/download/packages').glob('*setup.exe'))
          digest = hashlib.sha256(source.read_bytes()).hexdigest()
          version = os.environ['RELEASE_TAG'].removeprefix('windows-v')
          assert source.name == f'Afterglow_{version}_x64-setup.exe', 'Installer version must match the release.'
          manifest = (source.parent/'SHA256SUMS.txt').read_text(encoding='utf-8-sig')
          assert any(line.split() == [digest, source.name] for line in manifest.splitlines()), 'Installer differs from its build manifest.'
          print('Verified installer SHA256: ' + digest)
          stage = Path('windows/stage'); stage.mkdir()
          shutil.copy2(source, stage/'Afterglow-windows-x64-setup.exe')
          shutil.copy2('windows/VALIDATION.md', stage/'VALIDATION.md')
          (stage/'SHA256SUMS.txt').write_text(digest + '  Afterglow-windows-x64-setup.exe\n')
          shutil.copy2(source, stage/f'Afterglow-windows-{version}-x64-setup.exe')
          PYCODE
          gh release upload "$RELEASE_TAG" windows/stage/Afterglow-windows-x64-setup.exe windows/stage/SHA256SUMS.txt windows/stage/VALIDATION.md --clobber
          gh release upload v3.0.7-preview.1 "windows/stage/Afterglow-windows-${RELEASE_TAG#windows-v}-x64-setup.exe" --clobber
