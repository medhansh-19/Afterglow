name: Windows preview upgrade
on:
  workflow_dispatch:
    inputs:
      run_id:
        description: Windows preview run containing the new installer
        required: true
permissions:
  contents: read
  actions: read
jobs:
  upgrade:
    runs-on: windows-2025
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: afterglow-windows-x86_64-preview
          path: windows/download
          github-token: ${{ github.token }}
          run-id: ${{ inputs.run_id }}
      - name: Verify an existing preview upgrades with its library intact
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $old = Join-Path $env:RUNNER_TEMP 'afterglow-old-setup.exe'
          Invoke-WebRequest 'https://github.com/medhansh-19/Afterglow/releases/download/v3.0.7-preview.1/Afterglow-windows-x64-setup.exe' -OutFile $old
          $oldHash = (Get-FileHash $old -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($oldHash -ne '0611760eb71e739d41c40774e0221eb698567e2e4892f2e681672df4e8e9c267') { throw 'The published baseline changed. Review the upgrade fixture before proceeding.' }
          $install = Join-Path $env:RUNNER_TEMP 'afterglow-upgrade'
          $setup = Start-Process $old -ArgumentList @('/S', "/D=$install") -Wait -PassThru
          if ($setup.ExitCode -ne 0) { throw 'Baseline installation failed.' }
          ./windows/tests/native-smoke.ps1 -AppPath (Join-Path $install 'afterglow-windows.exe') -OutputDirectory windows/test-results/before
          $line = @(Get-Content windows/test-results/before/native.log | Where-Object { $_ -like 'library-path:*' })[-1]
          if (-not $line) { throw 'Baseline library path missing.' }
          $libraryPath = $line.Substring('library-path:'.Length)
          $library = Get-Content $libraryPath -Raw | ConvertFrom-Json
          $library.colors = @([pscustomobject]@{name='Upgrade verification';color='#22ccaa'})
          $library | ConvertTo-Json -Depth 50 | Set-Content $libraryPath -Encoding utf8NoBOM
          $before = (Get-FileHash $libraryPath -Algorithm SHA256).Hash
          $installer = Get-ChildItem windows/download -Recurse -Filter '*setup.exe' | Select-Object -First 1
          if (-not $installer) { throw 'New installer missing.' }
          $setup = Start-Process $installer.FullName -ArgumentList @('/S', "/D=$install") -Wait -PassThru
          if ($setup.ExitCode -ne 0) { throw 'Upgrade installation failed.' }
          if ((Get-FileHash $libraryPath -Algorithm SHA256).Hash -ne $before) { throw 'Installer modified the existing library.' }
          ./windows/tests/native-smoke.ps1 -AppPath (Join-Path $install 'afterglow-windows.exe') -OutputDirectory windows/test-results/after
          $library = Get-Content $libraryPath -Raw | ConvertFrom-Json
          if ($library.settings.clockSize -ne 120 -or $library.colors[0].name -ne 'Upgrade verification' -or $library.colors[0].color -ne '#22ccaa') { throw 'Updated app did not retain saved preferences and colors.' }
          @{ passed=$true; baseline='0.1.0'; updated='0.1.1'; originalInstallerHash=$oldHash; libraryPreserved=$true; savedColorPreserved=$true; nativeRelaunchPassed=$true } | ConvertTo-Json | Set-Content windows/test-results/upgrade.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-upgrade-validation
          path: windows/test-results
