name: Windows preview
run-name: Windows ${{ inputs.runtime_mode || 'full' }} runtime / ${{ inputs.native_profile || 'baseline' }} build
on:
  pull_request:
    paths: ['windows/**', 'linux/**', '.cargo/**', 'Sources/AfterglowCore/**', 'Sources/AfterglowLyricsService/**', 'Tests/**', 'Package.*', 'THIRD_PARTY_NOTICES.md', '.github/workflows/windows.yml']
  push:
    branches: ['main', 'codex/windows-app', 'codex/in-app-updates']
  workflow_dispatch:
    inputs:
      runtime_mode:
        description: Swift DLL bundle (full baseline, complete app runtime, or experimental imports)
        type: choice
        options: [full, runtime, imports]
        default: full
      native_profile:
        description: Native compiler profile to compare with baseline
        type: choice
        options: [baseline, balanced, size]
        default: baseline
      measure_performance:
        description: Record short demo/tray/wallpaper process-tree samples (not battery benchmarks)
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: windows-${{ github.event.pull_request.head.ref || github.ref_name }}-${{ inputs.runtime_mode || 'full' }}-${{ inputs.native_profile || 'baseline' }}
  cancel-in-progress: true
jobs:
  frontend-regressions:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: linux/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check packaging tools
        run: |
          python -m pip install -r windows/scripts/requirements-build.txt
          python -m unittest discover -s windows/tests -p 'test_packaging.py' -v
      - run: npm ci --prefix linux
      - run: pip install playwright
      - run: python -m playwright install --with-deps chromium
      - name: Exercise Windows shared UI and capture lifecycle
        env:
          AFTERGLOW_TEST_OUTPUT: windows/test-results/browser
        run: |
          npm run dev --prefix linux > /tmp/afterglow-vite.log 2>&1 &
          server=$!
          trap 'kill "$server"' EXIT
          for attempt in $(seq 1 30); do
            if curl --silent --fail http://127.0.0.1:1420/ > /dev/null; then break; fi
            sleep 1
          done
          python windows/tests/ui.py
          python windows/tests/regressions-ui.py
          python windows/tests/desktop-ui.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-browser-regressions
          path: windows/test-results/browser
  windows:
    runs-on: windows-2025
    timeout-minutes: 60
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: linux/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install packaging analysis tooling
        run: |
          $parseErrors = @()
          Get-ChildItem windows/scripts/*.ps1 | ForEach-Object {
            $tokens = $null; $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile($_.FullName, [ref]$tokens, [ref]$errors) | Out-Null
            $parseErrors += $errors
          }
          if ($parseErrors.Count) { throw ($parseErrors | Out-String) }
          ./windows/tests/packaging.ps1
          python -m pip install -r windows/scripts/requirements-build.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m unittest discover -s windows/tests -p 'test_packaging.py' -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Install Swift 6.2.1 for Windows
        uses: compnerd/gha-setup-swift@57fe462cd3c7b05ae8fcff79b00719312e305257
        with:
          swift-version: swift-6.2.1-release
          swift-build: 6.2.1-RELEASE
      - uses: dtolnay/rust-toolchain@stable
      - name: Use the selected compiler profile for tests and packaging
        env:
          NATIVE_PROFILE: ${{ inputs.native_profile || 'baseline' }}
        run: |
          $settings = & ./windows/scripts/native-profile.ps1 -NativeProfile $env:NATIVE_PROFILE
          foreach ($key in $settings.Keys) {
            if ($null -ne $settings[$key]) { "$key=$($settings[$key])" >> $env:GITHUB_ENV }
          }
      - uses: Swatinem/rust-cache@v2
        with:
          key: windows-${{ inputs.native_profile || 'baseline' }}
          workspaces: linux/src-tauri -> target
          cache-on-failure: true
      - uses: actions/cache/restore@v4
        id: swift-cache
        with:
          path: .build
          key: windows-2022-swift-6.2.1-${{ hashFiles('Package.swift', 'Package.resolved', 'Sources/AfterglowCore/**', 'Sources/AfterglowLyricsService/**', 'Tests/AfterglowCoreTests/**') }}
          restore-keys: windows-2022-swift-6.2.1-
      - name: Shared Swift core checks
        run: |
          swift run CoreChecks
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Build and stage the Windows lyric service
        env:
          RUNTIME_MODE: ${{ inputs.runtime_mode || 'full' }}
        run: |
          ./windows/scripts/build-sidecar.ps1 -RuntimeMode $env:RUNTIME_MODE
      - name: Shared lyric service protocol checks
        env:
          AFTERGLOW_LYRICS_BINARY: linux/src-tauri/binaries/afterglow-lyrics-x86_64-pc-windows-msvc.exe
          PYTHONUTF8: '1'
        run: |
          python linux/tests/service.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Shared and Windows frontend checks
        run: |
          npm ci --prefix linux
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm test --prefix linux
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node --test windows/tests/*.test.js
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm run build --prefix linux
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Start Windows audio services for real loopback acceptance
        run: |
          Set-Service AudioEndpointBuilder -StartupType Manual
          Set-Service Audiosrv -StartupType Manual
          Start-Service AudioEndpointBuilder
          Start-Service Audiosrv
      - name: Windows native unit checks
        run: |
          $env:TAURI_CONFIG = Get-Content windows/tauri.windows.conf.json -Raw
          cargo test --release --locked --manifest-path linux/src-tauri/Cargo.toml
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Collect bundled dependency notices
        run: |
          python linux/scripts/collect-notices.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Build Windows installer
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ''
          NATIVE_PROFILE: ${{ inputs.native_profile || 'baseline' }}
        run: |
          ./windows/scripts/build-installer.ps1 -NativeProfile $env:NATIVE_PROFILE
      - name: Install the preview and test the native application
        env:
          MEASURE_PERFORMANCE: ${{ inputs.measure_performance || 'false' }}
        run: |
          $installer = Get-ChildItem 'linux/src-tauri/target/release/bundle/nsis/*.exe' | Select-Object -First 1
          if (-not $installer) { throw 'No Windows setup executable was produced.' }
          $install = Join-Path $env:RUNNER_TEMP 'afterglow-installed'
          $setup = Start-Process -FilePath $installer.FullName -ArgumentList @('/S', "/D=$install") -PassThru -Wait
          if ($setup.ExitCode -ne 0) { throw "Installer exited with $($setup.ExitCode)." }
          python windows/scripts/measure-package.py --installer $installer.FullName --installed $install --frontend linux/dist --output windows/test-results/size/package.json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $measure = $env:MEASURE_PERFORMANCE -eq 'true'
          ./windows/tests/native-smoke.ps1 -AppPath (Join-Path $install 'afterglow-windows.exe') -OutputDirectory 'windows/test-results/native' -CheckDesktop -MeasurePerformance:$measure
      - name: Publish size summary
        if: always()
        run: |
          if (Test-Path windows/test-results/size/package.json) {
            $report = Get-Content windows/test-results/size/package.json -Raw | ConvertFrom-Json
            "### Windows package bytes" >> $env:GITHUB_STEP_SUMMARY
            "Installer: $($report.installer.bytes); installed: $($report.installedBytes)" >> $env:GITHUB_STEP_SUMMARY
            $report.components.PSObject.Properties | ForEach-Object { "- $($_.Name): $($_.Value)" >> $env:GITHUB_STEP_SUMMARY }
          }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-native-validation
          path: |
            windows/test-results/native/
            windows/test-results/native-legacy/
      - name: Stage preview packages and instructions
        if: always()
        run: |
          $destination = 'windows/test-results/packages'
          New-Item -ItemType Directory -Force $destination | Out-Null
          Get-ChildItem 'linux/src-tauri/target/release/bundle' -Recurse -File -Include *.exe,*.msi,*.sig -ErrorAction SilentlyContinue | Copy-Item -Destination $destination
          Copy-Item windows/README.md,windows/PLAN.md,windows/PARITY.md,windows/VALIDATION.md -Destination $destination -ErrorAction Continue
          Get-ChildItem $destination -File | Where-Object Extension -In '.exe','.msi' | ForEach-Object {
            $hash = Get-FileHash $_.FullName -Algorithm SHA256
            "$($hash.Hash.ToLowerInvariant())  $($_.Name)"
          } | Set-Content "$destination/SHA256SUMS.txt"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: afterglow-windows-x86_64-preview
          path: windows/test-results/
          if-no-files-found: warn
      - uses: actions/cache/save@v4
        if: always() && steps.swift-cache.outputs.cache-hit != 'true'
        with:
          path: .build
          key: ${{ steps.swift-cache.outputs.cache-primary-key }}

  legacy-desktop:
    needs: windows
    runs-on: windows-2025
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: afterglow-windows-x86_64-preview
          path: windows/download
      - name: Validate legacy desktop in an isolated installed session
        shell: pwsh
        run: |
          $installer = Get-ChildItem windows/download -Recurse -Filter '*setup.exe' | Select-Object -First 1
          if (-not $installer) { throw 'Installer missing' }
          $install = Join-Path $env:RUNNER_TEMP 'afterglow-legacy-installed'
          $setup = Start-Process $installer.FullName -ArgumentList @('/S', "/D=$install") -PassThru -Wait
          if ($setup.ExitCode -ne 0) { throw 'Installer failed' }
          ./windows/tests/native-smoke.ps1 -AppPath (Join-Path $install 'afterglow-windows.exe') -OutputDirectory windows/test-results/native-legacy -CheckDesktop -DesktopLayout legacy
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-legacy-validation
          path: windows/test-results/native-legacy
